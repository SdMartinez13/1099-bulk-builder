name: Direct Link Hotfix

on:
  push:
    branches:
      - hotfix-direct-link-appurl

permissions:
  contents: write

jobs:
  patch-verify-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: hotfix-direct-link-appurl

      - name: Apply exact app URL fix
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/routes/apps.1099-builder.jsx')
          text = path.read_text()

          old_import = 'import shopify, { authenticate } from "../shopify.server";'
          new_import = 'import { authenticate } from "../shopify.server";'
          old_return = '  return { appUrl: shopify.config.appUrl };'
          new_return = '  // eslint-disable-next-line no-undef\n  return { appUrl: process.env.SHOPIFY_APP_URL || "" };'

          assert text.count(old_import) == 1, 'Expected exactly one shopify default import'
          assert text.count(old_return) == 1, 'Expected exactly one shopify.config.appUrl return'

          text = text.replace(old_import, new_import, 1)
          text = text.replace(old_return, new_return, 1)
          path.write_text(text)
          PY

      - name: Verify only intended route changed
        run: |
          git status --short
          test "$(git status --short | wc -l)" -eq 1
          git diff -- app/routes/apps.1099-builder.jsx

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies for verification
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint builder app
        run: npx eslint app

      - name: Production build
        run: npm run build

      - name: Commit verified hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routes/apps.1099-builder.jsx
          git commit -m "Fix direct app proxy app URL"
          git push origin HEAD:hotfix-direct-link-appurl
