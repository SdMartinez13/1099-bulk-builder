name: App Proxy Hotfix CI

on:
  push:
    branches:
      - hotfix-app-proxy-hydration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          cache: npm

      - name: Install dependencies for verification
        run: npm install --package-lock=false --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint builder app
        run: npx eslint app

      - name: Production build
        run: npm run build
